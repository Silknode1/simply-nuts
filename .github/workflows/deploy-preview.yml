name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build:prototype
        continue-on-error: true

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const typecheckStatus = '${{ steps.typecheck.outcome }}';
            const buildStatus = '${{ steps.build.outcome }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const icon = (status) => status === 'success' ? ':white_check_mark:' : ':x:';
            const overall = (typecheckStatus === 'success' && buildStatus === 'success')
              ? ':rocket: **Preview build passed**'
              : ':warning: **Preview build failed**';

            const body = [
              overall,
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Typecheck | ${icon(typecheckStatus)} ${typecheckStatus} |`,
              `| Build | ${icon(buildStatus)} ${buildStatus} |`,
              '',
              `Commit: \`${sha}\``,
              `Run: [${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Preview build')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
